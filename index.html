<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Demand Dashboard</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e2dfd9;
    --accent:#1a4d3c; --accent-soft:#e8f0ec; --warn:#8a4b1f; --warn-soft:#fbf0e6;
    --bar:#2f7a5f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1120px;margin:0 auto;padding:32px 24px 80px}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  .meta-row{display:flex;flex-wrap:wrap;gap:20px;margin-top:14px;font-size:13px;color:var(--muted)}
  .meta-row b{color:var(--ink);font-weight:600}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:22px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 16px;font-weight:600}

  .weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
  .w label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
  .w label span{color:var(--accent);font-variant-numeric:tabular-nums}
  .w input[type=range]{width:100%;accent-color:var(--accent)}
  .w .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
  .wtotal{margin-top:14px;font-size:12.5px;color:var(--muted)}
  .wtotal.bad{color:var(--warn);font-weight:600}
  button.reset{margin-top:12px;background:none;border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit}
  button.reset:hover{border-color:var(--accent);color:var(--accent)}

  .ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .ctx div{border-left:2px solid var(--accent);padding-left:12px}
  .ctx p{margin:0 0 4px;font-size:13.5px}
  .ctx a{font-size:11.5px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
  .ctx a:hover{color:var(--accent);border-color:var(--accent)}

  .topic{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
  .thead{display:flex;align-items:flex-start;gap:16px;padding:20px;cursor:pointer;user-select:none}
  .thead:hover{background:#fbfaf9}
  .rk{flex:0 0 34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:600;font-size:15px}
  .tmain{flex:1;min-width:0}
  .tmain h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
  .tmain .ol{color:var(--muted);font-size:13.5px;margin:0}
  .tprice{font-size:12.5px;color:var(--muted);margin-top:7px}
  .tprice b{color:var(--accent);font-weight:600}
  .tscore{flex:0 0 92px;text-align:right}
  .tscore .num{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tscore .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .chev{flex:0 0 14px;color:var(--muted);transition:transform .18s;margin-top:8px}
  .topic.open .chev{transform:rotate(90deg)}

  .bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 18px}
  .bar .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
  .bar .bl b{color:var(--ink)}
  .track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;background:var(--bar);border-radius:3px;transition:width .3s}

  .body{display:none;border-top:1px solid var(--line);padding:20px;background:#fbfaf9}
  .topic.open .body{display:block}
  .body h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
  .body section{margin-bottom:18px}
  .body section:last-child{margin-bottom:0}
  .body ul{margin:0;padding-left:18px}
  .body li{margin-bottom:5px;font-size:13.5px}
  .body p{margin:0;font-size:13.5px}
  .risk{background:var(--warn-soft);border-left:3px solid var(--warn);padding:12px 14px;border-radius:0 6px 6px 0}
  .risk h4{color:var(--warn)}
  .who{background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:18px}
  .who h4{color:var(--accent)}
  .who .row{margin-bottom:10px}
  .who .row:last-child{margin-bottom:0}
  .who .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);
    font-weight:600;margin-bottom:3px}
  .bloom{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:20px;
    white-space:nowrap}
  ol.los{margin:0;padding:0;list-style:none;counter-reset:lo}
  ol.los li{position:relative;padding-left:26px;margin-bottom:11px;counter-increment:lo}
  ol.los li:last-child{margin-bottom:0}
  ol.los li::before{content:counter(lo);position:absolute;left:0;top:1px;width:18px;height:18px;
    border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;
    display:grid;place-items:center}
  ol.los li::after{content:"";position:absolute;left:8.5px;top:21px;bottom:-11px;width:1px;
    background:var(--accent);opacity:.28}
  ol.los li:last-child::after{display:none}
  ol.los .st{font-size:13.5px;display:block;margin-top:3px}
  .srcs{display:flex;flex-wrap:wrap;gap:8px}
  .srcs a{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;
    border-radius:20px;text-decoration:none}
  .srcs a:hover{background:var(--accent);color:#fff}

  .watch li{margin-bottom:10px;font-size:13.5px}
  .watch b{display:block}
  .watch span{color:var(--muted);font-size:12.5px}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  @media(max-width:640px){
    .bars{grid-template-columns:repeat(2,1fr)}
    .thead{flex-wrap:wrap}
    .tscore{flex:1;text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Learning Demand Dashboard</h1>
    <div class="sub" id="sub"></div>
    <div class="meta-row" id="meta"></div>
  </header>

  <div class="panel">
    <h2>Scoring weights &mdash; drag to re-rank</h2>
    <div class="weights" id="weights"></div>
    <div class="wtotal" id="wtotal"></div>
    <button class="reset" id="reset">Reset to defaults</button>
  </div>

  <div class="panel">
    <h2>Market context</h2>
    <div class="ctx" id="ctx"></div>
  </div>

  <div id="topics"></div>

  <div class="panel">
    <h2>Watchlist &mdash; scored but not shortlisted</h2>
    <ul class="watch" id="watch" style="margin:0;padding-left:18px"></ul>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const LABELS={demand:"Demand",wtp:"Willingness to pay",gap:"Underserved gap",build:"4-week buildability"};
let DATA=null, W=null;

function score(t){
  const tot=W.demand+W.wtp+W.gap+W.build;
  if(tot===0) return 0;
  return (t.scores.demand*W.demand + t.scores.wtp*W.wtp
        + t.scores.gap*W.gap + t.scores.build*W.build)/tot;
}

function renderWeights(){
  document.getElementById("weights").innerHTML=Object.keys(LABELS).map(k=>`
    <div class="w">
      <label for="w-${k}">${LABELS[k]}<span id="v-${k}">${W[k]}%</span></label>
      <input type="range" id="w-${k}" min="0" max="60" step="5" value="${W[k]}">
      <div class="hint">${DATA.meta.weight_definitions[k]}</div>
    </div>`).join("");
  Object.keys(LABELS).forEach(k=>{
    document.getElementById("w-"+k).addEventListener("input",e=>{
      W[k]=+e.target.value;
      document.getElementById("v-"+k).textContent=W[k]+"%";
      updateTotal(); renderTopics();
    });
  });
  updateTotal();
}
function updateTotal(){
  const tot=W.demand+W.wtp+W.gap+W.build;
  const el=document.getElementById("wtotal");
  el.textContent = tot===100
    ? "Weights total 100%. Scores are a weighted average on a 10-point scale."
    : `Weights total ${tot}% — scores are normalised against that total, so ranking stays valid.`;
  el.className = "wtotal" + (tot===0?" bad":"");
}

function renderTopics(){
  const ranked=[...DATA.topics].sort((a,b)=>score(b)-score(a));
  const open=new Set([...document.querySelectorAll(".topic.open")].map(e=>e.dataset.id));
  document.getElementById("topics").innerHTML=ranked.map((t,i)=>`
    <div class="topic${open.has(t.id)?" open":""}" data-id="${t.id}">
      <div class="thead">
        <div class="rk">${i+1}</div>
        <div class="tmain">
          <h3>${t.title}</h3>
          <p class="ol">${t.one_liner}</p>
          <div class="tprice">SMB owner <b>${t.price_primary}</b> &nbsp;·&nbsp; professional tier <b>${t.price_secondary}</b></div>
        </div>
        <div class="tscore">
          <div class="num">${score(t).toFixed(2)}</div>
          <div class="lb">score</div>
        </div>
        <div class="chev">&#9656;</div>
      </div>
      <div class="bars">
        ${Object.keys(LABELS).map(k=>`
          <div class="bar">
            <div class="bl"><span>${LABELS[k]}</span><b>${t.scores[k]}</b></div>
            <div class="track"><div class="fill" style="width:${t.scores[k]*10}%"></div></div>
          </div>`).join("")}
      </div>
      <div class="body">
        <div class="who">
          <div class="row">
            <div class="lbl">Target learner</div>
            <p>${t.learner_profile}</p>
          </div>
          <div class="row">
            <div class="lbl">Learning objectives &mdash; scaffolded</div>
            <ol class="los">${t.objectives.map(o=>`<li><span class="bloom">${o.bloom}</span><span class="st">${o.statement}</span></li>`).join("")}</ol>
          </div>
        </div>
        <section><h4>Demand evidence</h4><ul>${t.evidence.map(e=>`<li>${e}</li>`).join("")}</ul></section>
        <section><h4>Why this is underserved</h4><p>${t.why_underserved}</p></section>
        <section class="risk"><h4>Risks before you build</h4><p>${t.risks}</p></section>
        <section><h4>Buildability</h4><p>${t.buildability_notes}</p></section>
        <section><h4>Sources</h4><div class="srcs">${t.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("")}</div></section>
      </div>
    </div>`).join("");
  document.querySelectorAll(".thead").forEach(h=>{
    h.addEventListener("click",()=>h.parentElement.classList.toggle("open"));
  });
}

function renderStatic(){
  const m=DATA.meta;
  document.getElementById("sub").textContent=m.scope_constraint+" · "+m.audience;
  document.getElementById("meta").innerHTML=
    `<div>Cycle <b>${m.cycle}</b></div>
     <div>Generated <b>${m.generated}</b></div>
     <div>Next refresh <b>${m.next_refresh}</b></div>
     <div>Candidates scored <b>${DATA.topics.length+DATA.watchlist.length}</b></div>`;
  document.getElementById("ctx").innerHTML=DATA.market_context.map(c=>
    `<div><p>${c.stat}</p><a href="${c.url}" target="_blank" rel="noopener">${c.source}</a></div>`).join("");
  document.getElementById("watch").innerHTML=DATA.watchlist.map(w=>
    `<li><b>${w.title}</b><span>${w.note}</span></li>`).join("");
  document.getElementById("foot").textContent=
    `Scores are analyst judgements on a 1–10 scale, anchored to the cited evidence — they are directional, not measured. `+
    `Edit data/topics.json and reload to refresh. Cycle ${m.cycle}.`;
}

function boot(data){
  DATA=data; W={...DATA.meta.weights};
  renderStatic(); renderWeights(); renderTopics();
  document.getElementById("reset").addEventListener("click",()=>{
    W={...DATA.meta.weights}; renderWeights(); renderTopics();
  });
}

// Prefer external topics.json (the editable data layer); fall back to embedded copy
// so the file still works when opened directly from disk.
fetch("data/topics.json",{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(boot)
  .catch(()=>boot(JSON.parse(document.getElementById("embedded-data").textContent)));
</script>
